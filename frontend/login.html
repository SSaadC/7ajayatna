<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7ajayatna - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>7ajayatna 🎲</h1>
        <h2>Connexion</h2>

        <!-- Zone d'affichage des messages (erreur ou succès) -->
        <div id="message-box" class="message-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <input type="email" id="email" required placeholder="Ex: saad@inpt.ac.ma">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="Votre mot de passe">
            </div>

            <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <p class="auth-link">
            Pas encore de compte ? <a href="register.html">Créer un compte</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
